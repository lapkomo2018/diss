volumes:
  db-data:

services:
  backend:
    build:
      dockerfile: ./cmd/diss/Dockerfile
    env_file:
        - .env
    environment:
      DB_SOURCE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    ports:
        - "8000:8080"

    restart: unless-stopped

  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  migrate:
    image: gomicro/goose:latest
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./db/migrations:/migrations
    entrypoint: >
      goose
      -dir /migrations
      postgres "host=db user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
      up
